<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fraud Detection System{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
</head>
<body>
    <div class="container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="nav-brand">
                <span class="shield-icon">🛡️</span>
                <h1>Fraud Detector</h1>
            </div>
            <div class="nav-links">
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">
                    <span class="icon">📊</span> Dashboard
                </a>
                <a href="/monitoring/" class="{% if '/monitoring' in request.path %}active{% endif %}">
                    <span class="icon">👁️</span> Monitoring
                </a>
                <a href="/analytics/" class="{% if '/analytics' in request.path %}active{% endif %}">
                    <span class="icon">📈</span> Analytics
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script src="/static/js/dashboard.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
